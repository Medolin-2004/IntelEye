<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Surveillance System - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 700px;
      width: 100%;
      animation: fadeIn 1s ease;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #00ffd5;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      background: #00ffd5;
      color: #000;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 255, 213, 0.3);
    }

    .btn:hover {
      background: #00bfa6;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 255, 213, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
      .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Surveillance System</h1>
    <p>Real-time Weapon and Terrorist Detection with Smart Intelligence</p>
    <div class="btn-group">
      <a href="{{ url_for('login') }}" class="btn">User Login</a>
      <a href="{{ url_for('login') }}" class="btn">Admin Login</a>
      <a href="{{ url_for('register') }}" class="btn">Register</a>
    </div>
  </div>
</body>
</html>
