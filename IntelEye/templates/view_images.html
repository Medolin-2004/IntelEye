<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Offender Gallery</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
padding:40px;
}

header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:2.8rem;
color:#00ffd5;
}

.search-box{
max-width:400px;
margin:20px auto;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
}

.counter{
text-align:center;
margin-bottom:25px;
color:#00ffd5;
font-size:18px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.6);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:200px;
height:200px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin-top:10px;
}

.card a{
color:#00ffd5;
text-decoration:none;
}

.card a:hover{
text-decoration:underline;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
color:#00ffd5;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<h1>👤 Offender Gallery</h1>

</header>

<div class="search-box">

<input type="text" id="searchInput" placeholder="Search offender...">

</div>

<div class="counter">

Total Offenders: {{ offender_count }}

</div>

<div class="gallery">

{% for offender in offenders %}

<div class="card" data-name="{{ offender.name|lower }}">

<img src="{{ url_for('static', filename='uploads/' + offender.filename) }}">

<h3>

<a href="{{ url_for('offender_profile', name=offender.name) }}">

{{ offender.name }}

</a>

</h3>

</div>

{% endfor %}

</div>

<div class="back">

<a href="{{ url_for('admin_dashboard') }}">⬅ Back to Dashboard</a>

</div>

<script>

const searchInput=document.getElementById("searchInput")

searchInput.addEventListener("keyup",function(){

let filter=this.value.toLowerCase()

let cards=document.querySelectorAll(".card")

cards.forEach(card=>{

let name=card.getAttribute("data-name")

card.style.display=name.includes(filter) ? "block" : "none"

})

})

</script>

</body>

</html>
