<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>AI Video Surveillance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:40px;
}

/* HEADER */

header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:2.7rem;
color:#00ffd5;
}

header p{
color:#ccc;
margin-top:6px;
}

/* MAIN CARD */

.container{
width:100%;
max-width:1000px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border-radius:20px;
padding:40px;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
animation:fadeIn 1s ease;
}

/* UPLOAD BOX */

.upload-box{
border:2px dashed #00ffd5;
padding:50px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.upload-box:hover{
background:rgba(0,255,213,0.1);
}

.upload-box input{
display:none;
}

.upload-icon{
font-size:45px;
margin-bottom:10px;
}

/* BUTTON */

button{
margin-top:20px;
background:#00ffd5;
border:none;
padding:12px 28px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00bfa6;
transform:scale(1.05);
}

/* VIDEO + STREAM */

video,img{
margin-top:25px;
width:100%;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

/* ALERT */

.alert{
margin-top:20px;
padding:15px;
background:red;
font-size:20px;
font-weight:bold;
border-radius:10px;
display:none;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

/* LOADER */

.loader{
margin-top:20px;
display:none;
text-align:center;
}

.spinner{
border:6px solid rgba(255,255,255,0.2);
border-top:6px solid #00ffd5;
border-radius:50%;
width:45px;
height:45px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* BACK */

.back{
margin-top:30px;
text-align:center;
}

.back a{
color:#00ffd5;
font-weight:bold;
text-decoration:none;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

</style>

</head>

<body>

<header>
<h1>🎥 AI Video Surveillance</h1>
<p>Upload video and run real-time AI detection</p>
</header>

<div class="container">

<form method="POST" enctype="multipart/form-data">

<label class="upload-box">

<div class="upload-icon">📤</div>
<p>Click or Drag Video to Upload</p>

<input type="file" name="file" accept="video/*" required>

</label>

<div style="text-align:center">
<button type="submit">Upload Video</button>
</div>

</form>

{% if video %}

<h2 style="margin-top:30px">Original Video</h2>

<video controls>
<source src="{{ url_for('static', filename=video) }}">
</video>

<br>

<button onclick="startPrediction()">Run AI Prediction</button>

<div class="loader" id="loader">
<div class="spinner"></div>
<p>AI analyzing video...</p>
</div>

<div class="alert" id="alertBox">
🚨 THREAT DETECTED (WEAPON / OFFENDER) 🚨
</div>

<h2 style="margin-top:30px">AI Detection Stream</h2>

<img id="predictionStream">

{% endif %}

<div class="back">
<a href="{{ url_for('user_dashboard') }}">⬅ Back to Dashboard</a>
</div>

</div>

<!-- SIREN AUDIO -->

<audio id="alarmSound" preload="auto">
<source src="{{ url_for('static', filename='siren.mp3') }}" type="audio/mpeg">
</audio>

<script>

let alarm=document.getElementById("alarmSound")
let alarmEnabled=false

/* START AI STREAM */

function startPrediction(){

alarmEnabled=true

document.getElementById("loader").style.display="block"

document.getElementById("predictionStream").src="/video_prediction_feed"

setInterval(checkAlert,1000)

}

/* CHECK ALERT */

function checkAlert(){

fetch('/get_alert')
.then(res=>res.json())
.then(data=>{

if(data.alert){

document.getElementById("loader").style.display="none"

document.getElementById("alertBox").style.display="block"

if(alarmEnabled){

alarm.currentTime=0
alarm.play().catch(()=>{})

}

}

})

}

</script>

</body>
</html>
