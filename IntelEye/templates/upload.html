<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Admin - Add Offender</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
background:linear-gradient(135deg,#141e30,#243b55);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* MAIN CARD */

.container{
width:90%;
max-width:650px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.6);
animation:fadeIn 1s ease;
}

/* HEADER */

header{
text-align:center;
margin-bottom:30px;
}

header h1{
color:#00ffd5;
font-size:2.4rem;
}

header p{
color:#ccc;
margin-top:6px;
}

/* INPUT */

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:bold;
}

.input-group input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

/* UPLOAD AREA */

.upload-box{
border:2px dashed #00ffd5;
padding:40px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.upload-box:hover{
background:rgba(0,255,213,0.1);
}

.upload-box input{
display:none;
}

.upload-icon{
font-size:45px;
margin-bottom:10px;
}

/* PREVIEW */

.preview{
margin-top:20px;
text-align:center;
}

.preview img{
max-width:100%;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

/* BUTTON */

button{
margin-top:20px;
width:100%;
background:#00ffd5;
border:none;
padding:14px;
border-radius:30px;
font-weight:bold;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00bfa6;
transform:scale(1.02);
}

/* ALERTS */

.alert{
margin-top:20px;
padding:12px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.success{
background:#0bbf5e;
}

.error{
background:#e63946;
}

/* BACK */

.back{
margin-top:20px;
text-align:center;
}

.back a{
color:#00ffd5;
text-decoration:none;
font-weight:bold;
}

/* ANIMATION */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<header>
<h1>👤 Add Offender</h1>
<p>Upload face images to the offender database</p>
</header>

<form method="POST" enctype="multipart/form-data">

<div class="input-group">
<label>Offender Name</label>
<input type="text" name="name" placeholder="Enter offender name" required>
</div>

<label class="upload-box">

<div class="upload-icon">📤</div>
<p>Click or Drag Image to Upload</p>

<input type="file" name="file" id="fileInput" accept="image/*" required>

</label>

<div class="preview">
<img id="previewImage" style="display:none;">
</div>

<button type="submit">Upload Offender Image</button>

</form>

{% if success %}
<div class="alert success">
{{ success }}
</div>
{% endif %}

{% if error %}
<div class="alert error">
{{ error }}
</div>
{% endif %}

<div class="back">
<a href="{{ url_for('admin_dashboard') }}">⬅ Back to Admin Dashboard</a>
</div>

</div>

<script>

/* IMAGE PREVIEW */

const input=document.getElementById("fileInput")
const preview=document.getElementById("previewImage")

input.onchange=function(e){

const file=e.target.files[0]

if(file){

preview.src=URL.createObjectURL(file)
preview.style.display="block"

}

}

</script>

</body>
</html>
